name: scala-steward (dependency update PRs)

# Scans build.sbt/project/** for newer releases of every dependency (core/local/cli) and opens one
# PR per update it finds.

on:
  schedule:
    # Monday 12:00 UTC, the same slot dependabot.yml asks for.
    - cron: "0 12 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: sbt/setup-sbt@v1

      # A token, not the App key: a compromised Steward release then holds a credential for an hour.
      - name: marola-pr-bot token
        id: bot
        uses: marola-dev/marola-devkit/.github/actions/bot-token@v0.20.2
        with:
          app-id: ${{ vars.PR_BOT_APP_ID }}
          private-key: ${{ secrets.PR_BOT_KEY }}
          repositories: marola-app
          permission-contents: write
          permission-pull-requests: write

      - uses: scala-steward-org/scala-steward-action@3e5cae868160200afda12b57c150e56cede989ab # v2.97.0
        with:
          github-token: ${{ steps.bot.outputs.token }}
          author-name: ${{ steps.bot.outputs.user-name }}
          author-email: ${{ steps.bot.outputs.user-email }}
