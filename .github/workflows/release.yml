name: release

# A v* tag publishes ml-resources-<tag>.tar.gz, the resources marola-ml pins in its
# resources.version (MIP-0070 §5.4). A tag's asset is immutable: a re-run that finds it already
# attached fails rather than replace what a consumer has fetched (no --clobber).

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: build the asset
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/build-resources-tarball.sh ".tmp/ml-resources-$TAG.tar.gz"

      - name: attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          file=".tmp/ml-resources-$TAG.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$file"
          else
            gh release create "$TAG" "$file" --verify-tag --title "marola-app $TAG" \
              --notes "The ml resources tarball at $TAG."
          fi
