name: api docs

# `just api-docs`'s Scaladoc: a check on a PR, force-pushed to the `api-docs` branch from `main`,
# which the umbrella mounts (MIP-0074 §5.2).

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  api-docs:
    uses: marola-dev/marola-devkit/.github/workflows/api-docs.yml@v0.8.0
    # A called workflow's jobs can never exceed this; only its publish job writes.
    permissions:
      contents: write
    with:
      devkit-ref: v0.8.0
