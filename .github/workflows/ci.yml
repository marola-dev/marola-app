name: CI

# The devkit's reusable workflows at the pinned tag (MIP-0070 §5.6). Bump the tag here, the
# devkit-ref inputs, the docs-lint clone and flake.nix's input together.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dev:
        description: "Also build and push the :dev image (the Nix dev shell, slow and big)"
        type: boolean
        default: false

permissions:
  contents: read

# Only a PR run is cancelled when superseded: a later docs-only push to main must not cancel the
# image build of the push before it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/marola-app
  # Push only from main (a push, or a dispatch on main); a PR or another ref builds, never publishes.
  PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  build-test:
    uses: marola-dev/marola-devkit/.github/workflows/scala-ci.yml@v0.13.0
    with:
      # corpusFetch (build.sbt) puts corpus.version's release in .tmp/knowledge for RagOfflineSpec.
      sbt-tasks: 'corpusFetch scalafmtCheckAll "scalafixAll --check" compile test'

  # scala-ci leaves coverage out on purpose: sbt-scoverage re-instruments core/local/cli after the
  # gate above passed, and coverageAggregate sums one statement % for the README badge, which
  # marola-site's map shows from its site-data branch.
  coverage:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache sbt / coursier
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - uses: sbt/setup-sbt@v1

      - name: Coverage — instrumented build, statement %, shields.io endpoint JSON
        run: |
          sbt clean corpusFetch coverage test coverageReport coverageAggregate
          xml="$(find target -maxdepth 3 -path '*/scoverage-report/scoverage.xml')"
          python3 - "$xml" > coverage.json <<'PY'
          import json, re, sys
          xml = open(sys.argv[1]).read()
          pct = float(re.search(r'statement-rate="([0-9.]+)"', xml).group(1))
          color = "red" if pct < 50 else "yellow" if pct < 80 else "green"
          # "sc-cov": the umbrella's README also carries a Python "py-cov" badge.
          json.dump(
              {"schemaVersion": 1, "label": "sc-cov", "message": f"{pct:.0f}%", "color": color},
              sys.stdout,
          )
          PY
          echo && cat coverage.json

      - id: bot
        uses: marola-dev/marola-devkit/.github/actions/bot-token@v0.13.0
        with:
          app-id: ${{ vars.PR_BOT_APP_ID }}
          private-key: ${{ secrets.PR_BOT_KEY }}
          repositories: marola-site
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          repository: marola-dev/marola-site
          ref: site-data
          path: site-data
          token: ${{ steps.bot.outputs.token }}
      - name: Publish the coverage JSON to marola-site's site-data branch
        run: |
          mkdir -p site-data/coverage
          cp coverage.json site-data/coverage/latest.json
          git -C site-data add coverage/latest.json
          if git -C site-data diff --cached --quiet; then
            echo "coverage unchanged — nothing to push"
          else
            git -C site-data commit -q -m "coverage: ${{ github.repository }}@${{ github.sha }}"
            scripts/site-data-push.sh site-data
          fi

      - name: Rebuild the map so the coverage badge refreshes
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: gh api repos/marola-dev/marola-site/dispatches -f event_type=site-data-updated || echo "could not dispatch to marola-site — its next scheduled build (≤ 3 h) will pick the coverage number up"

  python:
    uses: marola-dev/marola-devkit/.github/workflows/python-ci.yml@v0.13.0
    with:
      ruff-version: "0.16.5"
      self-test-commands: |
        python3 scripts/smoke_record.py --self-test
        python3 scripts/ocr-post.py --self-test
        python3 scripts/strip_external_scripts.py --self-test
        scripts/corpus-fetch.sh --self-test
        scripts/site-data-push.sh --self-test
        scripts/build-resources-tarball.sh --self-test

  static:
    uses: marola-dev/marola-devkit/.github/workflows/static-ci.yml@v0.13.0
    with:
      actionlint-version: "1.7.12"
      hadolint-version: "2.14.0"
      hadolint-files: Dockerfile
      shellcheck-files: scripts/*.sh
      # Every compose profile must still render (MIP-0010).
      extra-commands: |
        docker compose --profile mlflow --profile ollama --profile local config --quiet
        git -c advice.detachedHead=false clone -q --depth 1 -b v0.13.0 https://github.com/marola-dev/marola-devkit /tmp/devkit && python3 /tmp/devkit/scripts/docs_lint.py .

  agents:
    uses: marola-dev/marola-devkit/.github/workflows/agents-check.yml@v0.13.0
    with:
      devkit-ref: v0.13.0

  # flake.lock pins what `nix develop` and the `dev` image resolve. Missing or stale fails this
  # job; the lock `nix flake lock` produced here is the flake-lock artifact to commit.
  flake-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: nix flake lock (adds a new input's pin, changes nothing else)
        id: lock
        run: nix flake lock
      - name: upload the regenerated flake.lock
        if: steps.lock.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: flake-lock
          path: flake.lock
          if-no-files-found: error
      - name: flake.lock is committed as nix flake lock leaves it
        run: |
          if ! git ls-files --error-unmatch flake.lock >/dev/null 2>&1 || ! git diff --quiet -- flake.lock; then
            echo "::error file=flake.lock::missing or stale — commit the flake-lock artifact of this run (or run 'nix flake lock')"
            exit 1
          fi

  # A called workflow's jobs can never exceed this; only its publish job writes (MIP-0074 §5.2).
  api-docs:
    uses: marola-dev/marola-devkit/.github/workflows/api-docs.yml@v0.13.0
    permissions:
      contents: write
    with:
      devkit-ref: v0.13.0

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'build.sbt'
              - 'project/**'
              - 'core/**'
              - 'local/**'
              - 'cli/**'
              - 'corpus.version'
              - 'scripts/corpus-fetch.sh'
              - '.github/workflows/ci.yml'

  # MIP-0008 §5.4: the Dockerfile's targets, built when their inputs change (a PR builds only `jvm`) and
  # pushed to GHCR from `main` — the artefacts `docker compose`, the smoke test (docker-smoke.yml) and, later, the
  # Container App run.
  jvm:
    needs: [changes, static]
    if: needs.changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: image-jvm-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The image ships the corpus release pinned in corpus.version as /app/knowledge.
      - run: scripts/corpus-fetch.sh
      - uses: docker/setup-qemu-action@v4
        if: env.PUSH == 'true'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=jvm
            type=raw,value=jvm-{{sha}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: jvm
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=jvm
          cache-to: type=gha,scope=jvm,mode=max
      - name: Start-up check (no network)
        run: |
          # MIP-0070 §5.4: /app/site stopped shipping in this image; prove it's actually gone,
          # then prove --site still works given an --areas file mounted in from outside the image.
          if docker run --rm --entrypoint ls "$IMAGE:jvm" /app/site; then
            echo "::error::/app/site should not exist in the jvm image" >&2
            exit 1
          fi
          docker run --rm -v "$PWD/cli/src/test/resources/site/areas.json:/app/areas.json:ro" "$IMAGE:jvm" \
            --site nope --areas /app/areas.json | tee /tmp/out.txt
          grep -q "known: floripa, rio" /tmp/out.txt

  native:
    needs: [changes, static]
    if: github.event_name != 'pull_request' && (needs.changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: image-native-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The image ships the corpus release pinned in corpus.version as /app/knowledge.
      - run: scripts/corpus-fetch.sh
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=native
            type=raw,value=native-{{sha}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: native
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=jvm
            type=gha,scope=native
          cache-to: type=gha,scope=native,mode=max
      - name: Start-up check (no network)
        run: |
          # distroless/base-debian12 has no shell or ls to re-run the jvm job's /app/site proof;
          # this only re-proves --site resolves an --areas file mounted in from outside the image.
          docker run --rm -v "$PWD/cli/src/test/resources/site/areas.json:/app/areas.json:ro" "$IMAGE:native" \
            --site nope --areas /app/areas.json | tee /tmp/out.txt
          grep -q "known: floripa, rio" /tmp/out.txt

  dev:
    needs: [changes, static]
    if: github.event_name == 'workflow_dispatch' && inputs.dev
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: image-dev-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=dev
            type=raw,value=dev-{{sha}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: dev
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max

  # The one check ci-rule requires in every marola repo (marola-dev/marola#813); it must report on
  # every run, so it needs every other job and passes on skipped ones.
  ci-ok:
    if: always()
    needs: [build-test, coverage, python, static, agents, flake-lock, api-docs, changes, jvm, native, dev]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a needed job ended $r"; exit 1 ;; esac
          done
