name: infra

# Compiles the Besom programs under infra/ on the PRs that touch them. Nothing here reaches GCP:
# `pulumi preview` and `up` are the owner's, locally (infra/forecast-benchmark/README.md).

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix develop --command just infra-compile
