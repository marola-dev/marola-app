# Scala/sbt dependencies are scala-steward.yml's. This file watches the workflows' actions only.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 * * 1,5"
      timezone: "America/Sao_Paulo"
    groups:
      actions:
        patterns: ["*"]
    # Bumped by hand: the tag also lives in `devkit-ref:` inputs and flake.nix, which dependabot
    # would leave behind.
    ignore:
      - dependency-name: "marola-dev/marola-devkit*"
